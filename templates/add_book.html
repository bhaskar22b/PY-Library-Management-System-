<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Book | Library Management</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/output.css') }}">
</head>

<body class="min-h-screen bg-slate-950 text-white">

    <!-- Navbar -->
    <nav class="border-b border-slate-800 bg-slate-950">

        <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">

            <h1 class="text-xl font-bold">
                Library<span class="text-blue-500">.</span>
            </h1>

            <a
                href="/dashboard"
                class="rounded-lg px-4 py-2 text-sm text-slate-300 transition hover:bg-slate-800 hover:text-white"
            >
                Dashboard
            </a>

        </div>

    </nav>


    <!-- Main Content -->
    <main class="mx-auto max-w-2xl px-6 py-12">

        <!-- Page Heading -->
        <div class="mb-8">

            <p class="text-sm font-medium text-blue-400">
                Book Management
            </p>

            <h2 class="mt-2 text-3xl font-bold text-white">
                Add New Book
            </h2>

            <p class="mt-2 text-slate-400">
                Add a new book to your library collection.
            </p>

        </div>


        <!-- Add Book Form -->
        <div class="rounded-2xl border border-slate-800 bg-slate-900 p-8 shadow-2xl">

            <form method="POST" action="/add-book" class="space-y-6">

                <!-- Book Title -->
                <div>

                    <label
                        for="title"
                        class="mb-2 block text-sm font-medium text-slate-300"
                    >
                        Book Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter book title"
                        required
                        class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 text-white placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
                    >

                </div>


                <!-- Author -->
                <div>

                    <label
                        for="author"
                        class="mb-2 block text-sm font-medium text-slate-300"
                    >
                        Author
                    </label>

                    <input
                        type="text"
                        id="author"
                        name="author"
                        placeholder="Enter author name"
                        required
                        class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 text-white placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
                    >

                </div>


                <!-- Category -->
                <div>

                    <label
                        for="category"
                        class="mb-2 block text-sm font-medium text-slate-300"
                    >
                        Category
                    </label>

                    <input
                        type="text"
                        id="category"
                        name="category"
                        placeholder="e.g. Programming"
                        class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 text-white placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
                    >

                </div>


                <!-- Quantity -->
                <div>

                    <label
                        for="quantity"
                        class="mb-2 block text-sm font-medium text-slate-300"
                    >
                        Quantity
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        min="1"
                        value="1"
                        required
                        class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
                    >

                </div>


                <!-- Buttons -->
                <div class="flex gap-4 pt-2">

                    <a
                        href="/dashboard"
                        class="w-1/2 rounded-lg border border-slate-700 px-5 py-3 text-center font-semibold text-slate-300 transition hover:border-slate-600 hover:bg-slate-800"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="w-1/2 rounded-lg bg-blue-600 px-5 py-3 font-semibold text-white transition hover:bg-blue-700"
                    >
                        Add Book
                    </button>

                </div>

            </form>

        </div>

    </main>

</body>

</html>
