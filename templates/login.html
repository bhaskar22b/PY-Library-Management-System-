<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Bhaskar</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/output.css') }}">
</head>

<body class="min-h-screen bg-slate-950 text-white">

    <!-- Login Container -->
    <div class="flex min-h-screen items-center justify-center px-6">

        <!-- Login Card -->
        <div class="w-full max-w-md">

            <div class="rounded-2xl border border-slate-800 bg-slate-900 p-8 shadow-2xl">

                <!-- Heading -->
                <div class="mb-8 text-center">

                    <h1 class="text-3xl font-bold text-white">
                        Welcome Back
                    </h1>

                    <p class="mt-2 text-slate-400">
                        Login to your account
                    </p>

                </div>

                <!-- Login Form -->
                <form method="post"
                      action="/submit"
                      class="space-y-6">

                    <!-- Username -->
                    <div>

                        <label
                            for="username"
                            class="mb-2 block text-sm font-medium text-slate-300"
                        >
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            required
                            class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 text-white placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
                        >

                    </div>

                    <!-- Password -->
                    <div>

                        <label
                            for="password"
                            class="mb-2 block text-sm font-medium text-slate-300"
                        >
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                            class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 text-white placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
                        >

                    </div>

                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="w-full rounded-lg bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-slate-900"
                    >
                        Login
                    </button>

                </form>

                <!-- Back to Portfolio -->
                <div class="mt-6 text-center">

                    <a
                        href="/"
                        class="text-sm text-slate-400 transition hover:text-blue-400"
                    >
                        ← Back to Portfolio
                    </a>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
