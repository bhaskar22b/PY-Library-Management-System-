<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Member Added | Library Management</title>

    <link rel="stylesheet"

</head>

<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center">

            </a>

                href="/add-member"
