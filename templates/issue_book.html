<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Issue Book | Library Management</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/output.css') }}">
</head>

<body class="min-h-screen bg-slate-950 text-white">

    <!-- Navbar -->
    <nav class="border-b border-slate-800 bg-slate-950">

        <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">

            <h1 class="text-xl font-bold">
                Library<span class="text-blue-500">.</span>
            </h1>

            <a
                href="/dashboard"
                class="rounded-lg px-4 py-2 text-sm text-slate-300 hover:bg-slate-800 hover:text-white"
            >
                Dashboard
            </a>

        </div>

    </nav>


    <!-- Main Content -->
    <main class="mx-auto max-w-2xl px-6 py-12">

        <div class="mb-8">

            <p class="text-sm font-medium text-blue-400">
                Book Management
            </p>

            <h2 class="mt-2 text-3xl font-bold">
                Issue Book
            </h2>

            <p class="mt-2 text-slate-400">
                Select a book and member to issue the book.
            </p>

        </div>


        <!-- Issue Form -->
        <div class="rounded-2xl border border-slate-800 bg-slate-900 p-8">

            <form method="POST" action="/issue-book" class="space-y-6">

                <!-- Book -->
                <div>

                    <label
                        for="book_id"
                        class="mb-2 block text-sm font-medium text-slate-300"
                    >
                        Select Book
                    </label>

                    <select
                        id="book_id"
                        name="book_id"
                        required
                        class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none"
                    >

                        <option value="">
                            Select a book
                        </option>

                        {% for book in books %}

                        <option value="{{ book.id }}">
                            {{ book.title }} — Available: {{ book.available_quantity }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Member -->
                <div>

                    <label
                        for="member_id"
                        class="mb-2 block text-sm font-medium text-slate-300"
                    >
                        Select Member
                    </label>

                    <select
                        id="member_id"
                        name="member_id"
                        required
                        class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none"
                    >

                        <option value="">
                            Select a member
                        </option>

                        {% for member in members %}

                        <option value="{{ member.id }}">
                            {{ member.name }} — {{ member.email }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Buttons -->
                <div class="flex gap-4 pt-2">

                    <a
                        href="/dashboard"
                        class="w-1/2 rounded-lg border border-slate-700 px-5 py-3 text-center font-semibold text-slate-300 hover:bg-slate-800"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="w-1/2 rounded-lg bg-blue-600 px-5 py-3 font-semibold text-white hover:bg-blue-700"
                    >
                        Issue Book
                    </button>

                </div>

            </form>

        </div>

    </main>

</body>

</html>
